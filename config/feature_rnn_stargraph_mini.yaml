use_bst: false

trainer:
  train_batches: 20000
  val_batches: 200
  val_only: false
  log_interval: 1
  val_interval: 5000
  out_dir: out/feature_rnn
  init_from: scratch
  log_to_file: true
  log_to_wandb: false
  wandb_project: ""
  compile: true

data:
  dataset: stargraph
  effective_batch_size: 60
  gradient_accum_steps: 2
  pair_accum_steps: 1
  goal_range: [25, 75]
  num_workers: 0
  stargraph_data_path: "data/stargraph/graph_5_5_sample_10000000.txt"
  stargraph_max_nodes: 50

model:
  architecture: feature_rnn
  n_layer: 8
  n_head: 4
  n_embd: 256
  dtype: float32
  dropout: 0.0
  bias: false
  vocab_size: 0 #will be overwritten by datamodule
  block_size: 512
  context_length: 0
  gpt_mode: next_token
  # Feature attn specific
  feature_selection_layers: 1
  feature_selection_heads: 4
  feature_selection_backward_distance: 5
  rope_enabled_for_inference: true
  recurrent_inference: false
  # Number of fixed augmented embedding per attn block
  n_fixed_feature_embeddings: 0
  n_model_split_u: 16
  n_model_split_v: 16
  omit_u_matrix: false
  omit_v_matrix: false
  orthogonal_regularization_factor: 1.0

optimizer:
  learning_rate: 3e-4
  weight_decay: 0.0
  beta1: 0.9
  beta2: 0.95
  muon_momentum: 0.95
  grad_clip: null

lr_scheduler:
  decay_lr: false
  warmup_iters: 100
  lr_decay_iters: 600000
  min_lr: 1e-5